apiVersion: apps/v1
kind: Deployment

metadata:
  name: mail-server
  namespace: mail-server

spec:
  replicas: 2
  selector:
    matchLabels:
      app: mail-server
  template:
    metadata:
      labels:
        app: mail-server
    spec:
      containers:
        - name: mail-server
          image: ghcr.io/devlopersabbir/mail-server:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: server-secret
