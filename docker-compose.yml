services:
  # Go Mail Server Service (Prod Only)
  mail-server:
    profiles:
      - prod
    image: ghcr.io/devlopersabbir/mail-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - MONGODB_URI=mongodb://root:examplepassword@mongodb:27017
      - MAX_WORKERS=50
      - QUEUE_CAPACITY=100000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - mail-network

  # Redis Database Service (Dev & Prod Profiles)
  redis:
    profiles:
      - prod
      - dev
    image: redis:alpine
    container_name: mail_server_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - mail-network

  # MongoDB Database Service (Dev & Prod Profiles)
  mongodb:
    profiles:
      - prod
      - dev
    image: mongo:latest
    container_name: mail_server_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=examplepassword
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db
    networks:
      - mail-network

  # Caddy Reverse Proxy & Load Balancer Service (Prod Profile)
  caddy:
    profiles:
      - prod
    image: caddy:alpine
    container_name: mail_server_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mail-server
    networks:
      - mail-network

networks:
  mail-network:
    driver: bridge

volumes:
  redis-data:
  mongo-data:
  caddy-data:
  caddy-config:
